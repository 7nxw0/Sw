<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f3fc"><title>100 Days</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input{font:inherit}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:radial-gradient(circle at 50% 20%,#fff 0,#fbf8fe 55%,#f1e8fa 100%);color:#42384b;min-height:100vh;min-height:100dvh}.app{min-height:100vh;min-height:100dvh;display:grid;place-items:center;
padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}.screen{display:none;width:min(92vw,520px);text-align:center}.screen.active{display:block;animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}h1{font-size:25px;font-weight:600;margin:0 0 28px}.datebox{display:flex;gap:8px;justify-content:center}.datebox input{width:100%;padding:15px 12px;border:1px solid #d9c7e8;border-radius:15px;background:#fff;color:#4c4054;font-size:17px;text-align:center;outline:none}.btn{border:0;border-radius:999px;padding:13px 25px;font-size:16px;background:#a985ca;color:white;box-shadow:0 5px 16px #bba3cf55;cursor:pointer}.btn.ghost{background:#fff;color:#775d91;border:1px solid #d8c7e5;box-shadow:none}.submit{margin-top:18px}.hint{min-height:25px;margin-top:14px;color:#9876b4;font-size:14px}.loveBtns{height:260px;position:relative}.loveBtns .btn{position:absolute;left:50%;top:0;transition:left .2s ease,top .2s ease,transform .2s ease,opacity .2s ease}.yes{transform:translateX(-115%);z-index:2}.no{transform:translateX(15%);z-index:3}.msg{min-height:32px;color:#9876b4;margin-top:8px}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:center}.card{padding:8px;border:0;background:transparent;box-shadow:none;cursor:pointer;border-radius:18px}.card img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:16px;transition:transform .18s ease}.card:active img{transform:scale(.94)}.home{margin-top:28px;background:none;border:0;color:#8b739f;text-decoration:underline;cursor:pointer}.viewer{width:min(94vw,720px)}.viewer img{display:block;max-width:100%;max-height:78vh;margin:auto;object-fit:contain;border-radius:10px;filter:drop-shadow(0 10px 22px #6e57701f)}.viewer .nav{display:flex;justify-content:center;gap:10px;margin-top:16px}.counter{font-size:13px;color:#947da5;margin:10px 0}.back{margin-top:15px}.bouquet img{max-height:74vh}.coupon img{max-height:65vh}@media(max-width:430px){.app{padding:18px}.menu{gap:8px}.card{padding:4px}h1{font-size:22px}.viewer img{max-height:73vh}.loveBtns{height:300px}}
</style></head><body><main class="app">
<section id="lock" class="screen active"><h1>비밀번호를 입력해 주세요</h1><div class="datebox"><input id="date" type="date" aria-label="비밀번호 날짜"></div><button class="btn submit" aria-label="확인" onclick="unlock()">✓</button><div id="hint" class="hint"></div></section>
<section id="love" class="screen"><h1>앞으로도 나랑 함께해줄래?</h1><div id="loveBtns" class="loveBtns"><button id="yes" class="btn yes" onclick="show('menu')">YES</button><button id="no" class="btn ghost no">NO</button></div><div id="nomsg" class="msg"></div></section>
<section id="menu" class="screen"><div class="menu"><button class="card" aria-label="꽃다발 보기" onclick="show('bouquet')"><img src="assets/menu-flower.jpeg" alt="꽃다발"></button><button class="card" aria-label="선물 보기" onclick="show('coupon')"><img src="assets/menu-gift.jpeg" alt="선물"></button><button class="card" aria-label="편지 보기" onclick="openLetter()"><img src="assets/menu-letter.jpeg" alt="편지"></button></div><button class="home" aria-label="처음으로 돌아가기" onclick="resetAll()">↺</button></section>
<section id="bouquet" class="screen viewer bouquet"><img src="assets/bouquet.jpeg" alt="100일 꽃다발"><div class="nav"><button class="btn ghost" aria-label="돌아가기" onclick="show('menu')">←</button></div></section>
<section id="coupon" class="screen viewer coupon"><img src="assets/coupon.png" alt="소원권"><div class="nav"><button class="btn ghost" aria-label="돌아가기" onclick="show('menu')">←</button></div></section>
<section id="letter" class="screen viewer"><img id="letterImg" src="assets/letter1.png" alt="편지"><div id="counter" class="counter">1 / 6</div><div class="nav"><button class="btn ghost" aria-label="이전" onclick="prevLetter()">‹</button><button class="btn" aria-label="다음" onclick="nextLetter()">›</button></div><button class="home back" aria-label="편지 닫기" onclick="show('menu')">×</button></section>
</main><script>
const screens=[...document.querySelectorAll('.screen')];

function show(id){
  screens.forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  requestAnimationFrame(()=>window.scrollTo(0,0));
}

// Safari/iOS에서도 안정적으로 연/월/일을 직접 비교
function unlock(){
  const value=(document.getElementById('date').value||'').trim();
  const p=value.split('-').map(Number);
  const ok=p.length===3 && p[0]===2026 && p[1]===5 && p[2]===18;
  if(ok){
    document.getElementById('hint').textContent='';
    show('love');
  }else{
    document.getElementById('hint').textContent='Hint. 우리가 사귄 날짜 💜';
  }
}

const no=document.getElementById('no');
const yes=document.getElementById('yes');
const loveBtns=document.getElementById('loveBtns');
const nomsg=document.getElementById('nomsg');

let hops=0;
let lastDodgeAt=0;

const messages={
  1:'그건 선택지에 없는데? 💜',
  5:'아직도 No야..?',
  7:'진짜 그럴 거야?',
  10:'Yes가 저기 있는데…',
  13:'너 미워',
  15:'진짜 계속 누를 거야?',
  17:'나는 계속 같이 있고 싶은데',
  19:'마지막 기회야 자기야',
  20:'이제 선택지는 하나야 💜'
};

function rectsOverlap(a,b,pad=22){
  return !(
    a.right+pad < b.left ||
    a.left-pad > b.right ||
    a.bottom+pad < b.top ||
    a.top-pad > b.bottom
  );
}

function placeNoAwayFromYes(){
  const box=loveBtns.getBoundingClientRect();
  const yesRect=yes.getBoundingClientRect();
  const noRect=no.getBoundingClientRect();
  const w=noRect.width, h=noRect.height;

  let chosen=null;

  // 여러 위치를 시도하되 YES와 충분한 거리를 둔 곳만 허용
  for(let i=0;i<160;i++){
    const x=8 + Math.random()*Math.max(1, box.width-w-16);
    const y=48 + Math.random()*Math.max(1, box.height-h-56);

    const candidate={
      left:box.left+x, right:box.left+x+w,
      top:box.top+y, bottom:box.top+y+h
    };

    if(!rectsOverlap(candidate,yesRect,28)){
      chosen={x,y};
      break;
    }
  }

  // 랜덤 위치가 없으면 가장 먼 아래 모서리로 강제 배치
  if(!chosen){
    const options=[
      {x:8,y:box.height-h-8},
      {x:box.width-w-8,y:box.height-h-8},
      {x:8,y:52},
      {x:box.width-w-8,y:52}
    ];
    let best=options[0], bestDist=-1;
    const yc={x:(yesRect.left+yesRect.right)/2,y:(yesRect.top+yesRect.bottom)/2};
    for(const o of options){
      const cx=box.left+o.x+w/2, cy=box.top+o.y+h/2;
      const d=(cx-yc.x)**2+(cy-yc.y)**2;
      if(d>bestDist){bestDist=d;best=o}
    }
    chosen=best;
  }

  no.style.left=chosen.x+'px';
  no.style.top=chosen.y+'px';
  no.style.transform='none';
}

function dodge(e){
  if(e){
    e.preventDefault();
    e.stopPropagation();
  }

  const now=Date.now();
  if(now-lastDodgeAt<220 || hops>=20) return;
  lastDodgeAt=now;

  hops++;

  // 20번 동안 YES가 조금씩 계속 커짐
  const scale=1+Math.min(hops,20)*0.045;
  yes.style.left='50%';
  yes.style.top='0';
  yes.style.transform=`translateX(-50%) scale(${scale})`;

  if(messages[hops]) nomsg.textContent=messages[hops];

  if(hops===13){
    setTimeout(()=>{
      if(hops===13) nomsg.textContent='...그래도 사랑해';
    },900);
  }

  if(hops>=20){
    no.style.pointerEvents='none';
    no.style.opacity='0';
    setTimeout(()=>{
      no.style.display='none';
      yes.style.left='50%';
      yes.style.top='85px';
      yes.style.transform=`translateX(-50%) scale(${scale})`;
    },220);
    return;
  }

  // YES 크기 변경 직후 잠깐 YES 터치를 막아서 겹침 순간 오작동 방지
  yes.style.pointerEvents='none';
  requestAnimationFrame(()=>{
    placeNoAwayFromYes();
    requestAnimationFrame(()=>{
      yes.style.pointerEvents='auto';
    });
  });
}

// iOS Safari + 일반 브라우저 호환
if(window.PointerEvent){
  no.addEventListener('pointerdown',dodge,{passive:false});
}else{
  no.addEventListener('touchstart',dodge,{passive:false});
  no.addEventListener('mousedown',dodge);
}
no.addEventListener('click',e=>{
  e.preventDefault();
  e.stopPropagation();
});

let page=1;
function renderLetter(){
  document.getElementById('letterImg').src=`assets/letter${page}.png`;
  document.getElementById('counter').textContent=`${page} / 6`;
}
function openLetter(){page=1;renderLetter();show('letter')}
function nextLetter(){if(page<6){page++;renderLetter()}else show('menu')}
function prevLetter(){if(page>1){page--;renderLetter()}}

function resetAll(){
  document.getElementById('date').value='';
  document.getElementById('hint').textContent='';
  nomsg.textContent='';
  hops=0;
  lastDodgeAt=0;

  no.style.display='';
  no.style.opacity='1';
  no.style.pointerEvents='';
  no.style.left='50%';
  no.style.top='0';
  no.style.transform='translateX(15%)';

  yes.style.pointerEvents='auto';
  yes.style.left='50%';
  yes.style.top='0';
  yes.style.transform='translateX(-115%)';

  page=1;
  renderLetter();
  show('lock');
}

window.addEventListener('orientationchange',()=>{
  setTimeout(()=>window.scrollTo(0,0),120);
});
</script></body></html>
